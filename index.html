<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comisión por Producto</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h2{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#222;
    color:white;
}

input{
    width:100%;
    border:none;
    outline:none;
    text-align:center;
    font-size:16px;
    background:transparent;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.agregar{
    background:#28a745;
    color:white;
}

.guardar{
    background:#007bff;
    color:white;
}
</style>
</head>

<body>

<h2>Comisión por Producto</h2>

<table id="tabla">
<thead>
<tr>
<th>Producto</th>
<th>Costo</th>
<th>Venta</th>
<th>Comisión</th>
</tr>
</thead>

<tbody>

<tr>
<td><input></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
</tr>

</tbody>
</table>

<button class="agregar" onclick="agregarFila()">
Agregar fila
</button>

<button class="guardar" onclick="guardar()">
Guardar cambios
</button>

<script>

function agregarFila(){

const tabla=document.querySelector("#tabla tbody");

const fila=document.createElement("tr");

fila.innerHTML=`
<td><input></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
`;

tabla.appendChild(fila);

}

function guardar(){

localStorage.setItem("tabla",document.querySelector("#tabla tbody").innerHTML);

alert("Cambios guardados");

}

window.onload=function(){

const datos=localStorage.getItem("tabla");

if(datos){

document.querySelector("#tabla tbody").innerHTML=datos;

}

}

</script>

</body>
</html>
